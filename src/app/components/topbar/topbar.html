<header class="topbar">
  <div class="topbar-content">
    <!-- Mobile menu button -->
    <button class="mobile-menu-btn" (click)="toggleMobileMenu()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>

    <!-- Recent Views -->
    <div class="recent-views" *ngIf="recentViews.length > 0">
      <a 
        *ngFor="let view of recentViews" 
        [routerLink]="view.route" 
        class="recent-view-item"
        [class.active]="isActiveRoute(view.route)"
      >
        <svg *ngIf="view.icon === 'home'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <svg *ngIf="view.icon === 'alert-circle'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <svg *ngIf="view.icon === 'map-pin'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
        <svg *ngIf="view.icon === 'layers'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2" />
          <polyline points="2 17 12 22 22 17" />
          <polyline points="2 12 12 17 22 12" />
        </svg>
        <svg *ngIf="view.icon === 'bar-chart'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10" />
          <line x1="12" y1="20" x2="12" y2="4" />
          <line x1="6" y1="20" x2="6" y2="14" />
        </svg>
        <svg *ngIf="view.icon === 'users'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <svg *ngIf="view.icon === 'package'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="16.5" y1="9.4" x2="7.5" y2="4.21" />
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
          <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
          <line x1="12" y1="22.08" x2="12" y2="12" />
        </svg>
        <svg *ngIf="view.icon === 'store'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l1-6h16l1 6" />
          <path d="M3 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0" />
          <path d="M5 22V12h14v10" />
          <path d="M9 22v-4h6v4" />
        </svg>
        <svg *ngIf="view.icon === 'settings'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        <svg *ngIf="view.icon === 'user'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </a>
    </div>

    <div class="search-box">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" placeholder="Buscar código NFC, local o técnico..." />
    </div>


    <div class="filters-dropdown-container" *ngIf="allFilters.length > 0">
      <button class="btn-filters-dropdown" (click)="toggleFiltersDropdown()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="6" x2="20" y2="6" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <line x1="4" y1="18" x2="20" y2="18" />
        </svg>
        Filtros
        <span class="badge-count" *ngIf="getActiveFiltersCount() > 0">{{ getActiveFiltersCount() }}</span>
      </button>

      <div class="filters-dropdown-panel" *ngIf="showFiltersDropdown" (clickOutside)="closeFiltersDropdown()">
        <div class="filters-dropdown-header">
          <span>Filtros disponibles</span>
          <span class="filters-count" *ngIf="allFilters.length > 0">{{ allFilters.length }}</span>
        </div>
        <div class="filters-dropdown-grid">
          <div class="filter-dropdown-item" *ngFor="let filter of allFilters">
            <div class="filter-wrapper-dropdown" [class.has-value]="filterValues[filter.key]">
              <span class="filter-label-dropdown">{{ filter.label }}</span>
              <input
                *ngIf="filter.type === 'input'"
                type="text"
                [placeholder]="filter.placeholder"
                class="filter-input-dropdown"
                [(ngModel)]="filterValues[filter.key]"
                (change)="applyFilters()"
              />
              <select
                *ngIf="filter.type === 'select'"
                class="filter-select-dropdown"
                [(ngModel)]="filterValues[filter.key]"
                (change)="filter.key === 'region' ? onRegionChange() : applyFilters()"
              >
                <option value="" disabled selected>{{ filter.placeholder }}</option>
                <option *ngFor="let opt of getFilterOptions(filter)" [value]="opt.value">
                  {{ opt.label }}
                </option>
              </select>
              <input
                *ngIf="filter.type === 'date'"
                type="date"
                class="filter-date-dropdown"
                [(ngModel)]="filterValues[filter.key]"
                (change)="applyFilters()"
              />
            </div>
          </div>
        </div>
        <div class="filters-dropdown-actions">
          <button class="btn-clear-filters" (click)="clearFilters()">Limpiar filtros</button>
        </div>
      </div>
    </div>

    <div class="user-actions">
      <div class="notifications-container">
        <button class="btn-icon" title="Notificaciones" (click)="toggleNotifications()">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          >
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span class="badge-dot"></span>
        </button>

        <div class="notifications-dropdown" *ngIf="showNotifications" (clickOutside)="closeNotifications()">
          <div class="notifications-header">
            <h4>Notificaciones</h4>
            <button class="mark-read" (click)="markAllRead()">Marcar todo leído</button>
          </div>
          <div class="notifications-list" *ngIf="notifications.length > 0">
            <div 
              class="notification-item" 
              *ngFor="let notif of notifications"
              [class.unread]="!notif.read"
            >
              <div class="notification-icon" [ngClass]="notif.type">
                <svg *ngIf="notif.type === 'alert'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                  <line x1="12" y1="9" x2="12" y2="13" />
                  <line x1="12" y1="17" x2="12.01" y2="17" />
                </svg>
                <svg *ngIf="notif.type === 'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                  <polyline points="22 4 12 14.01 9 11.01" />
                </svg>
                <svg *ngIf="notif.type === 'info'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10" />
                  <line x1="12" y1="16" x2="12" y2="12" />
                  <line x1="12" y1="8" x2="12.01" y2="8" />
                </svg>
              </div>
              <div class="notification-content">
                <div class="notification-title">{{ notif.title }}</div>
                <div class="notification-desc">{{ notif.message }}</div>
                <div class="notification-time">{{ notif.time }}</div>
              </div>
            </div>
          </div>
          <div class="notifications-empty" *ngIf="notifications.length === 0">
            No hay notificaciones
          </div>
        </div>
      </div>

      <div class="user-profile">
        <div class="avatar">AD</div>
        <div class="user-info">
          <span class="user-name">Administrador</span>
          <span class="user-role">Soporte Nivel 2</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <app-topbar-mobile *ngIf="showMobileMenu" (closeMenu)="closeMobileMenu()"></app-topbar-mobile>
</header>

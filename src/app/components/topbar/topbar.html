<header class="topbar">
  <div class="topbar-content">
    <div class="search-box">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" placeholder="Buscar código NFC, local o técnico..." />
    </div>


    <div class="filters-dropdown-container">
      <button class="btn-filters-dropdown" (click)="toggleFiltersDropdown()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="6" x2="20" y2="6" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <line x1="4" y1="18" x2="20" y2="18" />
        </svg>
        Filtros
        <span class="badge-count" *ngIf="getActiveFiltersCount() > 0">{{ getActiveFiltersCount() }}</span>
      </button>

      <div class="filters-dropdown-panel" *ngIf="showFiltersDropdown" (clickOutside)="closeFiltersDropdown()">
        <div class="filters-dropdown-header">
          <span>Filtros disponibles</span>
          <span class="filters-count" *ngIf="allFilters.length > 0">{{ allFilters.length }}</span>
        </div>
        <div class="filters-dropdown-grid">
          <div class="filter-dropdown-item" *ngFor="let filter of allFilters">
            <div class="filter-wrapper-dropdown" [class.has-value]="filterValues[filter.key]">
              <span class="filter-label-dropdown">{{ filter.label }}</span>
              <input
                *ngIf="filter.type === 'input'"
                type="text"
                [placeholder]="filter.placeholder"
                class="filter-input-dropdown"
                [(ngModel)]="filterValues[filter.key]"
                (change)="applyFilters()"
              />
              <select
                *ngIf="filter.type === 'select'"
                class="filter-select-dropdown"
                [(ngModel)]="filterValues[filter.key]"
                (change)="filter.key === 'region' ? onRegionChange() : applyFilters()"
              >
                <option value="" disabled selected>{{ filter.placeholder }}</option>
                <option *ngFor="let opt of getFilterOptions(filter)" [value]="opt.value">
                  {{ opt.label }}
                </option>
              </select>
              <input
                *ngIf="filter.type === 'date'"
                type="date"
                class="filter-date-dropdown"
                [(ngModel)]="filterValues[filter.key]"
                (change)="applyFilters()"
              />
            </div>
          </div>
        </div>
        <div class="filters-dropdown-actions">
          <button class="btn-clear-filters" (click)="clearFilters()">Limpiar filtros</button>
        </div>
      </div>
    </div>

    <div class="user-actions">
      <button class="btn-icon" title="Notificaciones">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"
        >
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        <span class="badge-dot"></span>
      </button>

      <div class="user-profile">
        <div class="avatar">AD</div>
        <div class="user-info">
          <span class="user-name">Administrador</span>
          <span class="user-role">Soporte Nivel 2</span>
        </div>
      </div>
    </div>
  </div>

</header>
